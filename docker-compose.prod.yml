# Full stack for a single-VM deploy (e.g. an Oracle Cloud Always Free instance).
# Unlike docker-compose.yml (local dev), the databases/broker are NOT published
# to the host here - only api-gateway is reachable from outside the machine.
services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: riders_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-auth:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: authDb
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authDb"]
      interval: 2s
      timeout: 5s
      retries: 15

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    restart: always
    depends_on:
      - rabbitmq
    environment:
      PORT: 3010
      RABBITMQ_URL: amqp://user:password@rabbitmq:5672
    ports:
      - 3010:3010

  # Applies pending Prisma migrations against postgres-auth, then exits.
  # authentications waits for this to finish successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        APP_NAME: authentications
    working_dir: /app/apps/authentications
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:root@postgres-auth:5432/authDb?schema=public
    command: npx prisma migrate deploy

  authentications:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: authentications
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres-auth:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      PORT: 3011
      RABBITMQ_URL: amqp://user:password@rabbitmq:5672
      DATABASE_URL: postgres://postgres:root@postgres-auth:5432/authDb?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-.env}

  rider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: rider
    restart: always
    depends_on:
      - postgres
      - rabbitmq
    environment:
      PORT: 3012
      RABBITMQ_URL: amqp://user:password@rabbitmq:5672
      RIDER_DATABASE_URL: postgres://root:root@postgres:5432/riders_db

  logging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: logging
    restart: always
    depends_on:
      - mongo
      - rabbitmq
    environment:
      PORT: 3013
      RABBITMQ_URL: amqp://user:password@rabbitmq:5672
      MONGO_URI: mongodb://root:root@mongo:27017/logging-db?authSource=admin

volumes:
  rabbitmq_data:
  postgres_data:
  postgres_auth_data:
  mongo_data:
